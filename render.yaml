# Blueprint do Render (opcional): publica a API Express a partir da pasta api/.
# Atenção: o disco do plano gratuito é temporário. Ao reiniciar, o SQLite é recriado com os produtos iniciais.
services:
  - type: web
    name: pettech-api-bmm
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: 20
